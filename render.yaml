services:
  - type: web
    name: sissa-chess
    env: node
    buildCommand: npm install && npm run build && npx drizzle-kit push
    startCommand: npm start
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
      - key: NODE_VERSION
        value: 20
